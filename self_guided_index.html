<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Two-Column Flexbox Layout</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <header>
    <span class="site-title">Site Title</span>

    <nav class="nav-links">
      <a href="#">Home</a>
      <a href="#">About</a>
      <a href="#">Contact</a>
    </nav>
  </header>

  <main>
    <section>
      <h1>Left Column</h1>
      <p>
        Left column content
      </p>
      <p>
        More content
      </p>
      <p>
        layout
      </p>
    </section>

    <aside>
      <h2>Right Column</h2>
      <p>
        Right column content
      </p>
      <p>
        list
      </p>
      <ul>
        <li>Sidebar item one</li>
        <li>Sidebar item two</li>
        <li>Sidebar item three</li>
      </ul>
    </aside>
  </main>

  <footer>
    <p>Footer content</p>
  </footer>

</body>
</html>
